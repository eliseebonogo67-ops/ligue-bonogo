<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1250">
<title>Ligue Bonogo - Mon profil</title>
<link rel="stylesheet" href="theme.css">
<style>
  .retour {
    display: grid;
    place-items: center;
    color: #fff;
    text-decoration: none;
    font-weight: 900;
  }
  .alerte {
    min-height: 18px;
    margin: 10px 0 0;
    text-align: center;
    color: #ff8a80;
    font-size: 13px;
    font-weight: 700;
  }
  .profil {
    margin: 22px 0 6px;
    text-align: center;
  }
  .profil .avatar {
    margin: 0 auto 10px;
    width: 96px;
    height: 96px;
    font-size: 50px;
  }
  .profil .nom {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
  }
  .profil .xp {
    margin: 4px 0 0;
    color: #ffd54a;
    font-weight: 800;
  }
  .bloc {
    margin: 46px auto 0;
  }
  label {
    display: block;
    margin: 0 0 6px 4px;
    font-size: 13px;
    font-weight: 800;
    color: var(--texte-doux);
  }
  input {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border-radius: 14px;
    border: 3px solid var(--or);
    background: #0b1250;
    color: #fff;
    font-family: inherit;
    font-size: 20px;
    font-weight: 800;
    text-align: center;
  }
  .aide {
    margin: 0 0 12px;
    color: #cfd6ff;
    font-size: 12px;
    text-align: center;
  }
  .titre-carte {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 10px;
    border-radius: 14px;
    border: 2px solid var(--bord);
    background: rgba(10, 18, 90, 0.75);
  }
  .titre-carte.porte {
    border-color: #7be046;
  }
  .titre-carte.verrouille {
    opacity: 0.8;
  }
  .titre-carte .corps {
    flex: 1;
    min-width: 0;
  }
  .titre-carte b {
    display: block;
    font-size: 15px;
  }
  .titre-carte span {
    display: block;
    font-size: 12px;
    color: #aab4ff;
  }
  .barre {
    height: 8px;
    margin-top: 6px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  .barre i {
    display: block;
    height: 100%;
    background: linear-gradient(#ffd54a, #ffa800);
  }
  .titre-carte button {
    flex: none;
    padding: 9px 12px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(#7be046, #2c9e12);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), 0 3px 0 #1b6a0a;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }
  .titre-carte button:disabled {
    background: #3a3f66;
    box-shadow: none;
    color: #9aa0c8;
    cursor: default;
  }
  .liens {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 26px;
  }
</style>
</head>
<body>
<div class="ecran">

  <header class="haut">
    <a class="icone retour" href="accueil.html">←</a>
    <b>Mon profil</b>
    <span style="width: 62px;"></span>
  </header>

  <p id="alerte" class="alerte"></p>

  <div class="profil">
    <div class="avatar">🧑‍🎓</div>
    <p id="nom" class="nom">…</p>
    <p id="titre-joueur" class="xp"></p>
    <p id="grade" class="xp"></p>
  </div>

  <section class="popup bloc">
    <div class="ruban">PSEUDO</div>
    <label for="pseudo">Ton pseudo (vu par les autres joueurs)</label>
    <input id="pseudo" maxlength="16" placeholder="Ex : Aziz" autocomplete="off">
    <p class="aide">3 à 16 caractères : lettres, chiffres, espaces, _ et -. Les accents sont retirés.</p>
    <button id="btn-enregistrer" class="btn vert" style="font-size: 18px; padding: 14px;">Enregistrer</button>
  </section>

  <section class="popup bloc">
    <div class="ruban">MES TITRES</div>
    <p class="aide">Les titres ne s’achètent pas : ils se méritent. Porte celui que tu as gagné.</p>
    <div id="titres"></div>
  </section>

  <p id="msg" class="message"></p>

  <div class="liens">
    <a class="btn jaune" href="boutique.html" style="font-size: 17px; padding: 14px;">🛍️ Boutique : avatars, cadres et thèmes</a>
    <a class="btn bleu" href="classement.html" style="font-size: 17px; padding: 14px;">🏅 Voir le classement</a>
  </div>

</div>

<script>
  window.addEventListener("error", function (e) {
    var a = document.getElementById("alerte");
    if (a) a.textContent = "Erreur : " + (e.message || "chargement impossible");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var a = document.getElementById("alerte");
    var r = e.reason;
    if (a) a.textContent = "Erreur : " + (r && r.message ? r.message : r);
  });
</script>

<script type="module">
import { signInAnonymously } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { ref, get, set, update } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
import { auth, db } from "./firebase.js";
import { gradeDe, totalXp, evaluerTitres } from "./progression.js";
import { memoriser, DEFAUTS } from "./profil.js";
import { Sons } from "./sons.js";

const $ = function (id) {
  return document.getElementById(id);
};

let uid = null;
let pseudoActuel = "";
let joueur = {};
let duelsPublics = {};

// ===== Filtre des pseudos =====
// Mots à ne jamais trouver dans un pseudo (même écrits avec des chiffres : m3rde, put4in…).
// La liste n'est pas exhaustive : ajoute-y les mots que tu vois passer.
const FRAGMENTS = [
  "merde", "putain", "salope", "connard", "connasse", "encule", "niquer", "batard", "bordel",
  "pedophile", "hitler", "terroriste", "fuck", "shit", "bitch", "asshole", "cunt",
  "nigger", "nigga", "faggot", "whore", "porn",
  "administrat", "moderat", "officiel", "bonogo"
];
// Mots courts : refusés seulement quand ils forment un mot entier (pour laisser passer « Monique », « Computer »…)
const MOTS = [
  "con", "cons", "cul", "bite", "zob", "pute", "putes", "pd", "pede", "fdp", "ntm", "tg",
  "nique", "niquer", "sexe", "sex", "viol", "pedo", "slut", "rape", "dick", "kkk", "nazi", "admin"
];

function forme(texte) {
  return texte
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/0/g, "o")
    .replace(/1/g, "i")
    .replace(/3/g, "e")
    .replace(/4/g, "a")
    .replace(/5/g, "s")
    .replace(/7/g, "t");
}

// Renvoie la raison du refus, ou "" si le pseudo est correct
function pseudoInterdit(texte) {
  const f = forme(texte);
  const colle = f.replace(/[^a-z]/g, "");
  for (let i = 0; i < FRAGMENTS.length; i++) {
    if (colle.indexOf(FRAGMENTS[i]) !== -1) return "Ce pseudo n’est pas autorisé.";
  }
  const mots = f.split(/[^a-z]+/).filter(function (m) {
    return m.length > 0;
  });
  for (let j = 0; j < mots.length; j++) {
    if (MOTS.indexOf(mots[j]) !== -1) return "Ce pseudo n’est pas autorisé.";
  }
  return "";
}

function dire(texte) {
  $("msg").textContent = texte;
}

// Retire les accents et les espaces en trop
function normaliser(texte) {
  return texte
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

// La clé qui garantit qu'un pseudo n'est pris que par un seul joueur
function cle(pseudo) {
  return pseudo.toLowerCase().replace(/ /g, "_");
}

async function enregistrer() {
  const nouveau = normaliser($("pseudo").value);
  if (!/^[A-Za-z0-9 _-]{3,16}$/.test(nouveau)) {
    Sons.faux();
    dire("Pseudo invalide : 3 à 16 caractères, lettres, chiffres, espaces, _ ou -.");
    return;
  }
  if (nouveau === pseudoActuel) {
    dire("C’est déjà ton pseudo.");
    return;
  }
  const refus = pseudoInterdit(nouveau);
  if (refus) {
    Sons.faux();
    dire(refus + " Choisis-en un autre.");
    return;
  }

  const kNouveau = cle(nouveau);
  const kAncien = pseudoActuel ? cle(pseudoActuel) : null;
  const maj = {};
  if (kNouveau !== kAncien) {
    maj["pseudos/" + kNouveau] = uid;
    if (kAncien) maj["pseudos/" + kAncien] = null;
  }
  maj["profils/" + uid + "/pseudo"] = nouveau;

  try {
    await update(ref(db), maj);
    pseudoActuel = nouveau;
    $("pseudo").value = nouveau;
    $("nom").textContent = nouveau;
    Sons.bon();
    dire("Pseudo enregistré : " + nouveau);
  } catch (e) {
    Sons.faux();
    if (e.code === "PERMISSION_DENIED") dire("Ce pseudo est déjà pris. Essaie-en un autre.");
    else dire("Enregistrement impossible : " + (e.code || e.message));
  }
}

function porte() {
  return (joueur.equipe && joueur.equipe.titre) || DEFAUTS.titre;
}

function afficherTitres() {
  const zone = $("titres");
  zone.innerHTML = "";
  const liste = evaluerTitres(joueur, duelsPublics);
  liste.forEach(function (t) {
    const gagne =
      t.id === "titre_recrue" ||
      t.merite ||
      !!(joueur.titres && joueur.titres[t.id]) ||
      !!(joueur.boutique && joueur.boutique[t.id]);
    const actuel = porte() === t.id;

    const carte = document.createElement("div");
    carte.className = "titre-carte" + (actuel ? " porte" : "") + (gagne ? "" : " verrouille");

    const corps = document.createElement("div");
    corps.className = "corps";
    const nom = document.createElement("b");
    nom.textContent = (gagne ? "" : "🔒 ") + t.texte;
    const desc = document.createElement("span");
    desc.textContent = t.desc;
    corps.appendChild(nom);
    corps.appendChild(desc);
    if (!gagne && t.cible > 0) {
      const info = document.createElement("span");
      info.textContent = t.valeur + " / " + t.cible;
      corps.appendChild(info);
      const barre = document.createElement("div");
      barre.className = "barre";
      const rempli = document.createElement("i");
      rempli.style.width = Math.round((t.valeur / t.cible) * 100) + "%";
      barre.appendChild(rempli);
      corps.appendChild(barre);
    }
    carte.appendChild(corps);

    const b = document.createElement("button");
    if (actuel) {
      b.textContent = "Porté ✓";
      b.disabled = true;
    } else if (gagne) {
      b.textContent = "Porter";
      b.addEventListener("click", function () {
        porterTitre(t);
      });
    } else {
      b.textContent = "À gagner";
      b.disabled = true;
    }
    carte.appendChild(b);
    zone.appendChild(carte);
  });
}

// Écrit une fois pour toutes les titres déjà mérités (c'est ce que vérifie la base de données)
async function enregistrerTitres() {
  const maj = {};
  evaluerTitres(joueur, duelsPublics).forEach(function (t) {
    if (t.merite && t.id !== "titre_recrue" && !(joueur.titres && joueur.titres[t.id])) {
      maj["joueurs/" + uid + "/titres/" + t.id] = true;
      joueur.titres = joueur.titres || {};
      joueur.titres[t.id] = true;
    }
  });
  if (Object.keys(maj).length > 0) await update(ref(db), maj);
}

async function porterTitre(t) {
  try {
    await enregistrerTitres();
    await set(ref(db, "joueurs/" + uid + "/equipe/titre"), t.id);
    joueur.equipe = joueur.equipe || {};
    joueur.equipe.titre = t.id;
    memoriser(joueur.equipe);
    Sons.bon();
    dire("Titre porté : " + t.texte);
    afficherTitres();
  } catch (e) {
    Sons.faux();
    dire("Impossible de porter ce titre : " + (e.code || e.message));
  }
}

async function demarrer() {
  try {
    const cred = await signInAnonymously(auth);
    uid = cred.user.uid;

    const [sp, sj] = await Promise.all([
      get(ref(db, "profils/" + uid)),
      get(ref(db, "joueurs/" + uid))
    ]);
    const p = sp.exists() ? sp.val() : {};
    const v = sj.exists() ? sj.val() : {};

    pseudoActuel = p.pseudo || "";
    $("pseudo").value = pseudoActuel;
    $("nom").textContent = pseudoActuel || "Choisis ton pseudo";

    joueur = v;
    duelsPublics = p.duels || {};

    const xp = totalXp(v);
    const g = gradeDe(xp);
    $("grade").textContent = g.grade.emoji + " " + g.grade.nom + " · " + xp + " XP";

    try {
      await enregistrerTitres();
    } catch (e) {
      // les titres se débloqueront à la prochaine ouverture
    }
    afficherTitres();
  } catch (e) {
    $("alerte").textContent = "Connexion impossible : " + (e.code || e.message);
  }
}

$("btn-enregistrer").addEventListener("click", enregistrer);
demarrer();
</script>
</body>
</html>
