<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1250">
<title>Ligue Bonogo - Défier un ami</title>
<link rel="stylesheet" href="theme.css">
<style>
  .retour {
    display: grid;
    place-items: center;
    color: #fff;
    text-decoration: none;
    font-weight: 900;
  }
  .bloc {
    margin: 46px auto 0;
  }
  label {
    display: block;
    margin: 0 0 6px 4px;
    font-size: 13px;
    font-weight: 800;
    color: var(--texte-doux);
  }
  select,
  input {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 16px;
    border-radius: 14px;
    border: 3px solid var(--or);
    background: #0b1250;
    color: #fff;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
  }
  input {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 6px;
    font-size: 24px;
  }
  .code-grand {
    margin: 6px 0 14px;
    padding: 12px;
    border-radius: 16px;
    border: 2px dashed var(--or);
    background: rgba(0, 0, 20, 0.5);
    text-align: center;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #ffd54a;
  }
  .pile .btn {
    margin-top: 18px;
  }
  .centre {
    text-align: center;
    color: var(--texte-doux);
    font-weight: 700;
    margin: 0;
  }
  .alerte {
    min-height: 20px;
    margin: 14px 0 0;
    text-align: center;
    color: #ff8a80;
    font-size: 13px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="ecran">

  <header class="haut">
    <a class="icone retour" href="accueil.html">←</a>
    <div class="pieces"><span class="piece">B</span><b id="solde">…</b></div>
    <span style="width: 62px;"></span>
  </header>

  <p id="alerte" class="alerte"></p>

  <section class="popup bloc">
    <div class="ruban">CRÉER UN DÉFI</div>
    <label for="niveau">Niveau</label>
    <select id="niveau"></select>
    <label for="matiere">Matière</label>
    <select id="matiere"></select>
    <label for="mise">Mise</label>
    <select id="mise">
      <option value="0">Sans mise</option>
      <option value="1">Mise : 5 pièces</option>
      <option value="2">Mise : 10 pièces</option>
    </select>
    <button id="btn-creer" class="btn jaune"><span class="ic">⚔️</span>Créer le défi</button>

    <div id="zone-code" class="pile" hidden>
      <p class="centre">Donne ce code à ton ami :</p>
      <div id="code" class="code-grand"></div>
      <button id="btn-wa" class="btn vert"><span class="ic">📲</span>Envoyer le code</button>
      <button id="btn-copier" class="btn bleu"><span class="ic">📋</span>Copier le lien</button>
      <button id="btn-commencer" class="btn jaune"><span class="ic">▶️</span>Commencer</button>
    </div>
  </section>

  <section class="popup bloc">
    <div class="ruban">REJOINDRE</div>
    <input id="saisie" maxlength="6" placeholder="CODE" autocomplete="off">
    <button id="btn-rejoindre" class="btn vert">Rejoindre le défi</button>
  </section>

  <p id="msg" class="message"></p>
  <p class="message">Un duel, c’est toujours 5 questions. Chaque joueur paie la mise au début du match. Le gagnant récupère les deux mises, égalité = remboursement.</p>

</div>

<script>
  window.addEventListener("error", function (e) {
    var a = document.getElementById("alerte");
    if (a) a.textContent = "Erreur : " + (e.message || "chargement impossible");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var a = document.getElementById("alerte");
    var r = e.reason;
    if (a) a.textContent = "Erreur : " + (r && r.message ? r.message : r);
  });
</script>

<script type="module">
import { signInAnonymously } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
import { auth, db } from "./firebase.js";
import { NIVEAUX, infoNiveau, infoMatiere, matieresPourNiveau } from "./matieres.js";
import { nombreDisponibles } from "./tirage.js";

// Code = "0" + mise (0, 1 ou 2) + 4 lettres au hasard.
// Le niveau, la matière et les 5 questions sont enregistrés dans la base par celui qui lance le duel.
const LETTRES = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const MISES = [0, 5, 10];
const QUESTIONS_MINI = 5;

const $ = function (id) {
  return document.getElementById(id);
};

let codeCourant = null;
let choixCourant = null;
let solde = null;

function dire(texte) {
  $("msg").textContent = texte;
}

function nouveauCode(indexMise) {
  let c = "0" + String(indexMise);
  for (let i = 0; i < 4; i++) {
    c += LETTRES.charAt(Math.floor(Math.random() * LETTRES.length));
  }
  return c;
}

function lireCode(code) {
  if (!/^[0-9][0-2][A-Z2-9]{4}$/.test(code)) return null;
  return { mise: MISES[parseInt(code.charAt(1), 10)] };
}

function urlDuel(code, slot, choix) {
  if (!lireCode(code)) return null;
  let u = "duel.html?m=" + encodeURIComponent(code) + "&slot=" + slot;
  if (slot === 1 && choix) {
    u += "&n=" + encodeURIComponent(choix.niveau) + "&mat=" + encodeURIComponent(choix.matiere || "tous");
  }
  return u;
}

function lienDefi(code) {
  return window.location.href.split("?")[0] + "?code=" + code;
}

function texteMise(m) {
  return m > 0 ? m + " pièces" : "aucune";
}

function copierSecours(texte) {
  try {
    const t = document.createElement("textarea");
    t.value = texte;
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(t);
    return ok;
  } catch (e) {
    return false;
  }
}

function copier(texte) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard
      .writeText(texte)
      .then(function () {
        return true;
      })
      .catch(function () {
        return copierSecours(texte);
      });
  }
  return Promise.resolve(copierSecours(texte));
}

async function chargerSolde() {
  try {
    const cred = await signInAnonymously(auth);
    const snap = await get(ref(db, "joueurs/" + cred.user.uid + "/pieces"));
    solde = snap.exists() ? snap.val() : 0;
    $("solde").textContent = solde;
  } catch (e) {
    $("solde").textContent = "?";
    $("alerte").textContent = "Connexion impossible : " + (e.code || e.message);
  }
}

// Les matières du niveau choisi (la salle BEPC n'a pas de Philosophie), avec le nombre de questions
function remplirMatieres() {
  const niveau = $("niveau").value;
  const zone = $("matiere");
  zone.innerHTML = "";

  let total = 0;
  const lignes = matieresPourNiveau(niveau).map(function (m) {
    const nb = nombreDisponibles(niveau, m.id);
    total += nb;
    return { m: m, nb: nb };
  });

  const tous = document.createElement("option");
  tous.value = "tous";
  tous.textContent = "🎲 Toutes les matières (" + total + ")";
  tous.disabled = total < QUESTIONS_MINI;
  zone.appendChild(tous);

  lignes.forEach(function (l) {
    const o = document.createElement("option");
    o.value = l.m.id;
    o.textContent = l.m.emoji + " " + l.m.nom + (l.nb >= QUESTIONS_MINI ? " (" + l.nb + ")" : " — bientôt");
    o.disabled = l.nb < QUESTIONS_MINI;
    zone.appendChild(o);
  });

  // première option utilisable
  for (let i = 0; i < zone.options.length; i++) {
    if (!zone.options[i].disabled) {
      zone.value = zone.options[i].value;
      break;
    }
  }
}

NIVEAUX.forEach(function (n) {
  const o = document.createElement("option");
  o.value = n.id;
  o.textContent = n.emoji + " " + n.nom;
  $("niveau").appendChild(o);
});
$("niveau").addEventListener("change", remplirMatieres);
remplirMatieres();

$("btn-creer").addEventListener("click", function () {
  const indexMise = parseInt($("mise").value, 10);
  const m = MISES[indexMise];
  if (solde !== null && m > solde) {
    dire("Solde insuffisant : il te faut " + m + " pièces (tu en as " + solde + ").");
    return;
  }
  const niveau = $("niveau").value;
  const matiere = $("matiere").value;
  if (!matiere || $("matiere").selectedOptions[0].disabled) {
    dire("Pas assez de questions pour ce choix : il en faut au moins " + QUESTIONS_MINI + ".");
    return;
  }
  choixCourant = { niveau: niveau, matiere: matiere === "tous" ? "" : matiere };
  codeCourant = nouveauCode(indexMise);
  $("code").textContent = codeCourant;
  $("zone-code").hidden = false;
  const lib = matiere === "tous" ? "toutes les matières" : infoMatiere(matiere).nom;
  dire("Défi créé · " + infoNiveau(niveau).nom + " · " + lib + " · mise : " + texteMise(m) + ". Donne le code à ton ami, puis touche Commencer.");
});

$("btn-wa").addEventListener("click", function () {
  if (!codeCourant) return;
  const info = lireCode(codeCourant);
  const lib = choixCourant && choixCourant.matiere ? infoMatiere(choixCourant.matiere).nom : "toutes les matières";
  const texte =
    "⚔️ Je te défie sur Ligue Bonogo ! 5 questions · " + infoNiveau(choixCourant.niveau).nom + " · " + lib +
    " · mise : " + texteMise(info.mise) + "\nCode : " + codeCourant + "\n" + lienDefi(codeCourant);
  if (navigator.share) {
    // Le partage du téléphone (WhatsApp, SMS…) est plus fiable qu'un lien direct
    navigator.share({ text: texte }).catch(function () {
      // partage annulé
    });
  } else {
    window.location.href = "https://wa.me/?text=" + encodeURIComponent(texte);
  }
});

$("btn-copier").addEventListener("click", function () {
  if (!codeCourant) return;
  copier(lienDefi(codeCourant)).then(function (ok) {
    dire(ok ? "Lien copié ✓" : "Copie impossible : donne simplement le code " + codeCourant);
  });
});

$("btn-commencer").addEventListener("click", function () {
  if (!codeCourant) return;
  window.location.href = urlDuel(codeCourant, 1, choixCourant);
});

$("saisie").addEventListener("input", function () {
  const info = lireCode($("saisie").value.trim().toUpperCase());
  if (info) dire("Duel de 5 questions · mise : " + texteMise(info.mise));
});

$("btn-rejoindre").addEventListener("click", function () {
  const code = $("saisie").value.trim().toUpperCase().replace(/\s/g, "");
  const info = lireCode(code);
  if (!info) {
    dire("Code invalide : il doit avoir 6 caractères.");
    return;
  }
  if (solde !== null && info.mise > solde) {
    dire("Solde insuffisant : il te faut " + info.mise + " pièces (tu en as " + solde + ").");
    return;
  }
  window.location.href = urlDuel(code, 2, null);
});

// Si l'ami ouvre le lien, le code est déjà rempli
const params = new URLSearchParams(window.location.search);
const recu = params.get("code");
if (recu) {
  $("saisie").value = recu.toUpperCase();
  const info = lireCode(recu.toUpperCase());
  dire(info ? "Duel de 5 questions · mise : " + texteMise(info.mise) : "Code reçu invalide.");
}

chargerSolde();
</script>
</body>
  </html>
