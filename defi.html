<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1250">
<title>Ligue Bonogo - Défier un ami</title>
<link rel="stylesheet" href="theme.css">
<style>
  .retour {
    display: grid;
    place-items: center;
    color: #fff;
    text-decoration: none;
    font-weight: 900;
  }
  .bloc {
    margin: 46px auto 0;
  }
  select,
  input {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 16px;
    border-radius: 14px;
    border: 3px solid var(--or);
    background: #0b1250;
    color: #fff;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
  }
  input {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 6px;
    font-size: 24px;
  }
  .code-grand {
    margin: 6px 0 14px;
    padding: 12px;
    border-radius: 16px;
    border: 2px dashed var(--or);
    background: rgba(0, 0, 20, 0.5);
    text-align: center;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #ffd54a;
  }
  .pile .btn {
    margin-top: 18px;
  }
  .centre {
    text-align: center;
    color: var(--texte-doux);
    font-weight: 700;
    margin: 0;
  }
  .alerte {
    min-height: 20px;
    margin: 14px 0 0;
    text-align: center;
    color: #ff8a80;
    font-size: 13px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="ecran">

  <header class="haut">
    <a class="icone retour" href="accueil.html">←</a>
    <div class="pieces"><span class="piece">B</span><b id="solde">…</b></div>
    <span style="width: 62px;"></span>
  </header>

  <p id="alerte" class="alerte"></p>

  <section class="popup bloc">
    <div class="ruban">CRÉER UN DÉFI</div>
    <select id="round"></select>
    <select id="mise">
      <option value="0">Sans mise</option>
      <option value="1">Mise : 5 pièces</option>
      <option value="2">Mise : 10 pièces</option>
    </select>
    <button id="btn-creer" class="btn jaune"><span class="ic">⚔️</span>Créer le défi</button>

    <div id="zone-code" class="pile" hidden>
      <p class="centre">Donne ce code à ton ami :</p>
      <div id="code" class="code-grand"></div>
      <button id="btn-wa" class="btn vert"><span class="ic">📲</span>Envoyer le code</button>
      <button id="btn-copier" class="btn bleu"><span class="ic">📋</span>Copier le lien</button>
      <button id="btn-commencer" class="btn jaune"><span class="ic">▶️</span>Commencer</button>
    </div>
  </section>

  <section class="popup bloc">
    <div class="ruban">REJOINDRE</div>
    <input id="saisie" maxlength="6" placeholder="CODE" autocomplete="off">
    <button id="btn-rejoindre" class="btn vert">Rejoindre le défi</button>
  </section>

  <p id="msg" class="message"></p>
  <p class="message">Chaque joueur paie la mise au début du match. Le gagnant récupère les deux mises, égalité = remboursement.</p>

</div>

<script>
  window.addEventListener("error", function (e) {
    var a = document.getElementById("alerte");
    if (a) a.textContent = "Erreur : " + (e.message || "chargement impossible");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var a = document.getElementById("alerte");
    var r = e.reason;
    if (a) a.textContent = "Erreur : " + (r && r.message ? r.message : r);
  });
</script>

<script type="module">
import { signInAnonymously } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
import { auth, db } from "./firebase.js";
import { ROUNDS } from "./rounds.js";

// Code = "0" + mise (0, 1 ou 2) + numéro du sujet (2 caractères) + 2 lettres au hasard
const LETTRES = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const MISES = [0, 5, 10];

const $ = function (id) {
  return document.getElementById(id);
};

let codeCourant = null;
let solde = null;

function dire(texte) {
  $("msg").textContent = texte;
}

function nouveauCode(indexRound, indexMise) {
  let c =
    "0" + String(indexMise) +
    LETTRES.charAt(Math.floor(indexRound / 32) % 32) +
    LETTRES.charAt(indexRound % 32);
  for (let i = 0; i < 2; i++) {
    c += LETTRES.charAt(Math.floor(Math.random() * LETTRES.length));
  }
  return c;
}

function lireCode(code) {
  if (!/^[0-9][0-2][A-Z2-9]{4}$/.test(code)) return null;
  const a = LETTRES.indexOf(code.charAt(2));
  const b = LETTRES.indexOf(code.charAt(3));
  if (a < 0 || b < 0) return null;
  const round = ROUNDS[a * 32 + b];
  if (!round) return null;
  return { round: round, mise: MISES[parseInt(code.charAt(1), 10)] };
}

function urlDuel(code, slot) {
  const info = lireCode(code);
  if (!info) return null;
  return (
    "duel.html?m=" + encodeURIComponent(code) +
    "&r=" + encodeURIComponent(info.round.id) +
    "&slot=" + slot
  );
}

function lienDefi(code) {
  return window.location.href.split("?")[0] + "?code=" + code;
}

function texteMise(m) {
  return m > 0 ? m + " pièces" : "aucune";
}

function copierSecours(texte) {
  try {
    const t = document.createElement("textarea");
    t.value = texte;
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(t);
    return ok;
  } catch (e) {
    return false;
  }
}

function copier(texte) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard
      .writeText(texte)
      .then(function () {
        return true;
      })
      .catch(function () {
        return copierSecours(texte);
      });
  }
  return Promise.resolve(copierSecours(texte));
}

async function chargerSolde() {
  try {
    const cred = await signInAnonymously(auth);
    const snap = await get(ref(db, "joueurs/" + cred.user.uid + "/pieces"));
    solde = snap.exists() ? snap.val() : 0;
    $("solde").textContent = solde;
  } catch (e) {
    $("solde").textContent = "?";
    $("alerte").textContent = "Connexion impossible : " + (e.code || e.message);
  }
}

ROUNDS.forEach(function (r, i) {
  const o = document.createElement("option");
  o.value = i;
  o.textContent = r.titre;
  $("round").appendChild(o);
});

$("btn-creer").addEventListener("click", function () {
  const indexMise = parseInt($("mise").value, 10);
  const m = MISES[indexMise];
  if (solde !== null && m > solde) {
    dire("Solde insuffisant : il te faut " + m + " pièces (tu en as " + solde + ").");
    return;
  }
  codeCourant = nouveauCode(parseInt($("round").value, 10), indexMise);
  $("code").textContent = codeCourant;
  $("zone-code").hidden = false;
  dire("Défi créé (mise : " + texteMise(m) + "). Donne le code à ton ami, puis touche Commencer.");
});

$("btn-wa").addEventListener("click", function () {
  if (!codeCourant) return;
  const info = lireCode(codeCourant);
  const texte =
    "⚔️ Je te défie sur Ligue Bonogo ! Mise : " + texteMise(info.mise) +
    "\nCode : " + codeCourant + "\n" + lienDefi(codeCourant);
  if (navigator.share) {
    // Le partage du téléphone (WhatsApp, SMS…) est plus fiable qu'un lien direct
    navigator.share({ text: texte }).catch(function () {
      // partage annulé
    });
  } else {
    window.location.href = "https://wa.me/?text=" + encodeURIComponent(texte);
  }
});

$("btn-copier").addEventListener("click", function () {
  if (!codeCourant) return;
  copier(lienDefi(codeCourant)).then(function (ok) {
    dire(ok ? "Lien copié ✓" : "Copie impossible : donne simplement le code " + codeCourant);
  });
});

$("btn-commencer").addEventListener("click", function () {
  if (!codeCourant) return;
  window.location.href = urlDuel(codeCourant, 1);
});

$("saisie").addEventListener("input", function () {
  const info = lireCode($("saisie").value.trim().toUpperCase());
  if (info) {
    dire("Round : " + info.round.titre + " · mise : " + texteMise(info.mise));
  }
});

$("btn-rejoindre").addEventListener("click", function () {
  const code = $("saisie").value.trim().toUpperCase().replace(/\s/g, "");
  const info = lireCode(code);
  if (!info) {
    dire("Code invalide : il doit avoir 6 caractères.");
    return;
  }
  if (solde !== null && info.mise > solde) {
    dire("Solde insuffisant : il te faut " + info.mise + " pièces (tu en as " + solde + ").");
    return;
  }
  window.location.href = urlDuel(code, 2);
});

// Si l'ami ouvre le lien, le code est déjà rempli
const params = new URLSearchParams(window.location.search);
const recu = params.get("code");
if (recu) {
  $("saisie").value = recu.toUpperCase();
  const info = lireCode(recu.toUpperCase());
  dire(info
    ? "Round : " + info.round.titre + " · mise : " + texteMise(info.mise)
    : "Code reçu invalide.");
}

chargerSolde();
</script>
</body>
  </html>
