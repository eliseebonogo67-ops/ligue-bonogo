<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1250">
<title>Ligue Bonogo - Accueil</title>
<link rel="stylesheet" href="theme.css">
<style>
  .bandeau-bienvenue {
    margin: 10px 0 0;
    padding: 10px;
    border-radius: 14px;
    background: linear-gradient(#ffd54a, #ffa800);
    color: #5a3a00;
    text-align: center;
    font-size: 14px;
    font-weight: 900;
  }
  .abo-etat {
    display: block;
    margin: 6px auto 0;
    text-align: center;
    color: #ffd54a;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
  }
  .lien-abo {
    display: block;
    margin: 18px auto 0;
    text-align: center;
    color: #aab4ff;
    font-size: 14px;
    font-weight: 700;
  }
  .alerte-compte {
    display: block;
    margin: 8px 0 0;
    padding: 9px 10px;
    border-radius: 12px;
    border: 2px solid #ffd54a;
    background: rgba(255, 213, 74, 0.12);
    color: #ffe9a0;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="ecran">

  <header class="haut">
    <a class="avatar" href="profil.html" style="text-decoration: none; color: inherit;">🧑‍🎓</a>
    <div class="pieces"><span class="piece">B</span><b id="solde">…</b></div>
    <button class="icone" aria-label="Notifications">🔔<i class="point"></i></button>
  </header>
  <p id="titre-joueur" class="xp"></p>

  <p id="bienvenue" class="bandeau-bienvenue" hidden></p>
  <a id="alerte-compte" class="alerte-compte" href="compte.html" hidden>⚠️ Protège ton compte avec un e-mail pour ne pas perdre tes pièces</a>

  <div class="grade">
    <span id="badge-grade" class="badge">🛡️</span>
    <div class="jauge"><div id="jauge-plein" class="jauge-plein" style="width: 0%;"></div></div>
    <span id="badge-suivant" class="badge">🪖</span>
  </div>
  <p id="xp-texte" class="xp">…</p>
  <p id="serie-jours" class="xp"></p>
  <a id="abo-etat" class="abo-etat" href="abonnement.html" hidden></a>

  <div class="rangee">
    <div class="lib"><a class="icone" href="boutique.html" style="display: grid; place-items: center; text-decoration: none;">🛍️</a>Boutique</div>
    <div class="lib"><a class="icone" href="classement.html" style="display: grid; place-items: center; text-decoration: none;">🏅</a>Classement</div>
  </div>
  <div class="rangee" style="margin-top: 18px;">
    <div class="lib"><a class="icone" href="palmares.html" style="display: grid; place-items: center; text-decoration: none;">🎖️</a>Palmarès</div>
    <div class="lib"><button id="btn-defi" class="icone">🎁<i id="point-defi" class="point"></i></button>Défi du jour</div>
  </div>

  <nav class="menu">
    <a class="btn jaune" href="salon.html"><span class="ic">🏆</span>Compétitions</a>
    <a class="btn bleu" href="defi.html"><span class="ic">⚔️</span>Défier un ami</a>
    <a class="btn bleu" href="duels.html" style="font-size: 18px; padding: 14px;"><span class="ic">📜</span>Mes duels</a>
    <a class="btn vert" href="entrainement.html"><span class="ic">📚</span>Entraînement</a>
    <button id="btn-test" class="btn bleu" style="font-size: 16px; padding: 12px;" hidden>🎁 +50 pièces (test)</button>
    <a id="lien-admin" class="btn jaune" href="admin.html" style="font-size: 16px; padding: 12px;" hidden>🔧 Administration</a>
    <a id="lien-abonnes" class="btn jaune" href="abonnes.html" style="font-size: 16px; padding: 12px;" hidden>👥 Abonnés</a>
  </nav>
  <a class="lien-abo" href="abonnement.html">⭐ Abonnement</a>
  <a class="lien-abo" href="compte.html" style="margin-top: 8px;">🔐 Mon compte</a>
  <p id="msg-test" class="message"></p>
  <div style="height: 80px;"></div>

</div>

<div id="fond-defi" class="fond" hidden>
  <div class="popup">
    <div class="ruban">DÉFI DU JOUR</div>
    <button id="fermer-defi" class="croix" aria-label="Fermer">✕</button>
    <p id="defi-texte" style="text-align: center; font-weight: 800; font-size: 17px; margin: 6px 0;"></p>
    <div class="jauge" style="margin: 14px 0 6px;"><div id="defi-jauge" class="jauge-plein" style="width: 0%;"></div></div>
    <p id="defi-progres" class="xp"></p>
    <button id="btn-reclamer" class="btn vert" style="margin-top: 14px;" disabled>Pas encore accompli</button>
    <a class="btn jaune" href="entrainement.html" style="margin-top: 16px; font-size: 17px; padding: 12px;">📚 M’entraîner</a>
    <p id="defi-msg" class="message"></p>
  </div>
</div>

<script type="module">
import { ref, get, update } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
import { db, authReel } from "./firebase.js";
import { Sons, animerCompteur } from "./sons.js";
import { aujourdhui, gradeDe, totalXp, calculerSerie, defiDuJour, progresDefi } from "./progression.js";
import {
  connecter,
  assurerCompte,
  lireStatut,
  dateLongue,
  ABONNEMENT_ACTIF,
  CADEAU_PIECES,
  ESSAI_JOURS
} from "./abonnement.js";

const $ = function (id) {
  return document.getElementById(id);
};

let uid = null;
let v = {};

// Mode administrateur (boutons Administration, Abonnés et test) : visible seulement sur ton téléphone.
// Ouvre accueil.html?admin=1 pour l'activer (?admin=0 pour le couper),
// ou appuie 5 fois vite sur la ligne d'XP (marche aussi dans l'application).
function majAdmin(actif) {
  $("lien-admin").hidden = !actif;
  $("lien-abonnes").hidden = !actif;
  $("btn-test").hidden = !actif;
}

try {
  const params = new URLSearchParams(window.location.search);
  if (params.get("admin") === "1") localStorage.setItem("ligue_admin", "1");
  if (params.get("admin") === "0") localStorage.removeItem("ligue_admin");
  majAdmin(localStorage.getItem("ligue_admin") === "1");
} catch (e) {
  // sans importance
}

let touches = 0;
let derniereTouche = 0;
$("xp-texte").addEventListener("click", function () {
  const maintenantMs = Date.now();
  touches = maintenantMs - derniereTouche < 1500 ? touches + 1 : 1;
  derniereTouche = maintenantMs;
  if (touches < 5) return;
  touches = 0;
  try {
    if (localStorage.getItem("ligue_admin") === "1") {
      localStorage.removeItem("ligue_admin");
      majAdmin(false);
      $("msg-test").textContent = "Mode administrateur désactivé.";
    } else {
      localStorage.setItem("ligue_admin", "1");
      majAdmin(true);
      $("msg-test").textContent = "Mode administrateur activé.";
    }
  } catch (e) {
    $("msg-test").textContent = "Impossible d’enregistrer le mode administrateur sur cet appareil.";
  }
});

function afficherProgression() {
  $("solde").textContent = v.pieces || 0;

  const xp = totalXp(v);
  const g = gradeDe(xp);
  $("badge-grade").textContent = g.grade.emoji;
  $("badge-suivant").textContent = g.suivant ? g.suivant.emoji : "⭐";
  $("jauge-plein").style.width = g.pct + "%";
  $("xp-texte").textContent = g.suivant
    ? g.grade.nom + " · " + xp + " / " + g.suivant.xp + " XP"
    : g.grade.nom + " · " + xp + " XP (grade maximum)";

  const s = calculerSerie(v, aujourdhui());
  if (s.serie > 0) {
    $("serie-jours").textContent =
      "🔥 " + s.serie + " jour" + (s.serie > 1 ? "s" : "") + " d’affilée" +
      (s.aujourdhuiFait ? " ✓" : " · joue aujourd’hui pour la garder");
  } else {
    $("serie-jours").textContent = "Joue aujourd’hui pour lancer ta série 🔥";
  }
}

function afficherDefi() {
  const jour = aujourdhui();
  const d = defiDuJour(jour);
  const p = progresDefi(d, v, jour);
  const reclame = !!(v.defi && v.defi[jour]);

  $("defi-texte").textContent = d.texte;
  $("defi-jauge").style.width = Math.round((p / d.cible) * 100) + "%";
  $("defi-progres").textContent = p + " / " + d.cible + " · récompense : " + d.recompense + " 🪙";

  const b = $("btn-reclamer");
  if (reclame) {
    b.textContent = "Récompense récupérée ✓";
    b.disabled = true;
  } else if (p >= d.cible) {
    b.textContent = "Récupérer " + d.recompense + " 🪙";
    b.disabled = false;
  } else {
    b.textContent = "Pas encore accompli";
    b.disabled = true;
  }
  $("point-defi").hidden = reclame;
}

// L'état de l'abonnement n'est affiché qu'une fois l'abonnement activé pour le public
async function afficherAbonnement() {
  if (!ABONNEMENT_ACTIF) return;
  const s = await lireStatut(uid);
  const a = $("abo-etat");
  if (s.phase === "essai") {
    a.textContent = "🎁 Essai gratuit : " + s.joursRestants + " jour" + (s.joursRestants > 1 ? "s" : "") + " restant" + (s.joursRestants > 1 ? "s" : "");
  } else if (s.phase === "abonne") {
    a.textContent = "✅ Abonné jusqu’au " + dateLongue(s.jusqua);
  } else {
    a.textContent = "⏳ Essai terminé · touche ici pour t’abonner";
  }
  a.hidden = false;
}

async function charger() {
  const snap = await get(ref(db, "joueurs/" + uid));
  v = snap.exists() ? snap.val() : {};
  afficherProgression();
  afficherDefi();
}

async function reclamer() {
  const jour = aujourdhui();
  const d = defiDuJour(jour);
  if ((v.defi && v.defi[jour]) || progresDefi(d, v, jour) < d.cible) return;

  const avant = v.pieces || 0;
  const maj = {};
  maj["joueurs/" + uid + "/pieces"] = avant + d.recompense;
  maj["joueurs/" + uid + "/defi/" + jour] = true;
  try {
    await update(ref(db), maj);
    v.pieces = avant + d.recompense;
    v.defi = v.defi || {};
    v.defi[jour] = true;
    animerCompteur($("solde"), avant, v.pieces, 900);
    afficherDefi();
    $("defi-msg").textContent = "+" + d.recompense + " 🪙 !";
  } catch (e) {
    $("defi-msg").textContent = "Erreur : " + (e.code || e.message);
  }
}

async function demarrer() {
  try {
    uid = await connecter();

    // Première visite : 50 pièces offertes (et début de l'essai gratuit)
    const compte = await assurerCompte(uid);
    if (compte.nouveau) {
      $("bienvenue").textContent =
        "🎁 Bienvenue ! " + CADEAU_PIECES + " pièces offertes" +
        (ABONNEMENT_ACTIF ? " et " + ESSAI_JOURS + " jours d’essai gratuit." : ".");
      $("bienvenue").hidden = false;
    }

    await charger();
    // Compte invité : on invite à le protéger (sinon tout est perdu en cas de réinstallation)
    if (authReel.currentUser && authReel.currentUser.isAnonymous) {
      $("alerte-compte").hidden = false;
    }
    afficherAbonnement().catch(function () {
      // sans importance
    });
  } catch (e) {
    $("solde").textContent = "?";
    $("msg-test").textContent = "Erreur : " + (e.code || e.message);
  }
}

$("btn-defi").addEventListener("click", function () {
  afficherDefi();
  $("defi-msg").textContent = "";
  $("fond-defi").hidden = false;
});
$("fermer-defi").addEventListener("click", function () {
  $("fond-defi").hidden = true;
});
$("btn-reclamer").addEventListener("click", reclamer);

// Bouton de test (visible seulement en mode administrateur)
$("btn-test").addEventListener("click", async function () {
  if (!uid) return;
  try {
    const actuel = v.pieces || 0;
    const maj = {};
    maj["joueurs/" + uid + "/pieces"] = actuel + 50;
    await update(ref(db), maj);
    v.pieces = actuel + 50;
    animerCompteur($("solde"), actuel, actuel + 50, 1000);
    $("msg-test").textContent = "+50 pièces de test ajoutées.";
  } catch (e) {
    $("msg-test").textContent = "Erreur : " + (e.code || e.message);
  }
});

demarrer();
</script>
</body>
  </html>
