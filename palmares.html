<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1250">
<title>Ligue Bonogo - Palmares</title>
<link rel="stylesheet" href="theme.css">
<style>
  .retour {
    display: grid;
    place-items: center;
    color: #fff;
    text-decoration: none;
    font-weight: 900;
  }
  .alerte {
    min-height: 18px;
    margin: 10px 0 0;
    text-align: center;
    color: #ff8a80;
    font-size: 13px;
    font-weight: 700;
  }
  .onglets {
    display: flex;
    gap: 8px;
    margin: 16px 0 6px;
  }
  .onglet {
    flex: 1;
    padding: 10px 4px;
    border-radius: 14px;
    border: 2px solid var(--bord);
    background: rgba(0, 0, 25, 0.5);
    color: #cfd6ff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .onglet.actif {
    border-color: var(--or);
    color: #ffd54a;
    background: linear-gradient(#2a3db5, #17238a);
  }
  .infos {
    margin: 8px 0;
    text-align: center;
    color: #cfd6ff;
    font-size: 13px;
    font-weight: 700;
  }
  .moi {
    margin: 10px 0 6px;
    padding: 12px;
    border-radius: 16px;
    border: 2px solid #7be046;
    background: rgba(40, 120, 60, 0.35);
    text-align: center;
    font-weight: 800;
    font-size: 15px;
  }
  .moi small {
    display: block;
    margin-top: 4px;
    color: #cfd6ff;
    font-weight: 600;
    font-size: 12px;
  }
  .rang {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 10px;
    border-radius: 16px;
    border: 2px solid var(--bord);
    background: rgba(10, 18, 90, 0.75);
  }
  .rang.cest-moi {
    border-color: #7be046;
  }
  .num {
    flex: none;
    width: 34px;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    color: #ffd54a;
  }
  .mini {
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid var(--or);
    background: linear-gradient(#2c3fb8, #121c70);
    display: grid;
    place-items: center;
    font-size: 24px;
  }
  .texte {
    flex: 1;
    min-width: 0;
  }
  .texte b {
    display: block;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .texte span {
    font-size: 12px;
    color: #aab4ff;
  }
  .points {
    flex: none;
    text-align: right;
    font-weight: 900;
    color: #ffd54a;
    font-size: 15px;
  }
  .points small {
    display: block;
    font-size: 11px;
    color: #aab4ff;
    font-weight: 600;
  }
  .section {
    margin: 30px 0 4px;
    text-align: center;
    font-size: 18px;
    color: #ffd54a;
  }
  .champion {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding: 9px 10px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.07);
    font-size: 14px;
  }
  .champion .sem {
    flex: none;
    width: 70px;
    color: #aab4ff;
    font-weight: 700;
    font-size: 12px;
  }
  .champion .nom {
    flex: 1;
    min-width: 0;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .champion .gain {
    flex: none;
    color: #ffd54a;
    font-weight: 900;
  }
</style>
</head>
<body>
<div class="ecran">

  <header class="haut">
    <a class="icone retour" href="accueil.html">←</a>
    <b>🎖️ Palmarès</b>
    <span style="width: 62px;"></span>
  </header>

  <p id="alerte" class="alerte"></p>

  <div class="onglets">
    <button id="onglet-0" class="onglet actif">Cette semaine</button>
    <button id="onglet-1" class="onglet">Semaine dernière</button>
  </div>
  <p id="infos" class="infos"></p>
  <div id="moi" class="moi">Chargement…</div>
  <div id="liste"></div>

  <h2 class="section">🏆 Champions des semaines passées</h2>
  <div id="champions"></div>

  <p class="message">Le palmarès classe l’XP gagné pendant la semaine (du lundi au dimanche). Il se met à jour quand tu ouvres l’application.</p>
  <div style="height: 70px;"></div>

</div>

<script>
  window.addEventListener("error", function (e) {
    var a = document.getElementById("alerte");
    if (a) a.textContent = "Erreur : " + (e.message || "chargement impossible");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var a = document.getElementById("alerte");
    var r = e.reason;
    if (a) a.textContent = "Erreur : " + (r && r.message ? r.message : r);
  });
</script>

<script type="module">
import { signInAnonymously } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {
  ref,
  get,
  query,
  orderByChild,
  limitToLast,
  startAt
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
import { auth, db } from "./firebase.js";
import { article, RARETES, DEFAUTS } from "./profil.js";
import { semaineIl, resteSemaine } from "./progression.js";

const $ = function (id) {
  return document.getElementById(id);
};

let uid = null;
let onglet = 0;

function numeroSemaine(sem) {
  return "Semaine " + parseInt(sem.slice(-2), 10);
}

function nomDe(p, id) {
  return p.pseudo || "Joueur " + id.slice(-4).toUpperCase();
}

function compter(snap) {
  if (typeof snap.size === "number") return snap.size;
  if (typeof snap.numChildren === "function") return snap.numChildren();
  let n = 0;
  snap.forEach(function () {
    n++;
  });
  return n;
}

function ligne(rang, id, p) {
  const animal = article(p.animal) || article(DEFAUTS.animal);
  const titre = article(p.titre) || article(DEFAUTS.titre);
  const r = RARETES[animal.rarete];

  const div = document.createElement("div");
  div.className = "rang" + (id === uid ? " cest-moi" : "");

  const num = document.createElement("div");
  num.className = "num";
  num.textContent = rang === 1 ? "🥇" : rang === 2 ? "🥈" : rang === 3 ? "🥉" : rang;

  const mini = document.createElement("div");
  mini.className = "mini";
  mini.textContent = animal.emoji;
  mini.style.borderColor = r.couleur;
  mini.style.boxShadow = r.ombre;

  const texte = document.createElement("div");
  texte.className = "texte";
  const nom = document.createElement("b");
  nom.textContent = nomDe(p, id);
  const sous = document.createElement("span");
  sous.textContent = titre.texte;
  texte.appendChild(nom);
  texte.appendChild(sous);

  const pts = document.createElement("div");
  pts.className = "points";
  pts.textContent = "+" + (p.gain || 0);
  const petit = document.createElement("small");
  petit.textContent = "XP";
  pts.appendChild(petit);

  div.appendChild(num);
  div.appendChild(mini);
  div.appendChild(texte);
  div.appendChild(pts);
  return div;
}

// Le top 20 d'une semaine, sans les joueurs qui n'ont rien gagné
async function chargerSemaine(sem) {
  const snap = await get(query(ref(db, "palmares/" + sem), orderByChild("gain"), limitToLast(20)));
  const liste = [];
  snap.forEach(function (c) {
    const p = c.val();
    if ((p.gain || 0) > 0) liste.push({ id: c.key, p: p });
  });
  liste.sort(function (a, b) {
    return (b.p.gain || 0) - (a.p.gain || 0);
  });
  return liste;
}

async function afficher() {
  const sem = semaineIl(onglet);
  $("onglet-0").className = "onglet" + (onglet === 0 ? " actif" : "");
  $("onglet-1").className = "onglet" + (onglet === 1 ? " actif" : "");

  if (onglet === 0) {
    const r = resteSemaine();
    $("infos").textContent = numeroSemaine(sem) + " · il reste " + r.jours + " j " + r.heures + " h";
  } else {
    $("infos").textContent = numeroSemaine(sem) + " · terminée";
  }

  $("liste").innerHTML = "";
  $("moi").textContent = "Chargement…";

  try {
    const liste = await chargerSemaine(sem);
    const zone = $("liste");
    if (liste.length === 0) {
      const vide = document.createElement("p");
      vide.className = "message";
      vide.textContent = "Personne au palmarès pour le moment. Entraîne-toi pour être le premier !";
      zone.appendChild(vide);
    }
    liste.forEach(function (e, i) {
      zone.appendChild(ligne(i + 1, e.id, e.p));
    });

    // Mon rang cette semaine-là
    const sMoi = await get(ref(db, "palmares/" + sem + "/" + uid));
    const moi = $("moi");
    moi.innerHTML = "";
    const gain = sMoi.exists() ? sMoi.val().gain || 0 : 0;
    const titre = document.createElement("div");
    if (gain > 0) {
      const meilleurs = await get(query(ref(db, "palmares/" + sem), orderByChild("gain"), startAt(gain + 1)));
      titre.textContent = "Ton rang : " + (compter(meilleurs) + 1) + " · +" + gain + " XP";
    } else {
      titre.textContent = onglet === 0 ? "Tu n’as pas encore gagné d’XP cette semaine" : "Tu n’as pas gagné d’XP cette semaine-là";
    }
    moi.appendChild(titre);
    if (onglet === 0 && gain === 0) {
      const aide = document.createElement("small");
      aide.textContent = "Fais un round d’entraînement ou joue une compétition.";
      moi.appendChild(aide);
    }
  } catch (e) {
    $("alerte").textContent = "Impossible de charger le palmarès : " + (e.code || e.message);
    $("moi").textContent = "";
  }
}

// Le vainqueur de chacune des 8 dernières semaines
async function chargerChampions() {
  const zone = $("champions");
  zone.innerHTML = "";
  const semaines = [];
  for (let n = 1; n <= 8; n++) semaines.push(semaineIl(n));

  const resultats = await Promise.all(
    semaines.map(function (sem) {
      return chargerSemaine(sem).then(function (liste) {
        return liste.length ? liste[0] : null;
      });
    })
  );

  let trouves = 0;
  resultats.forEach(function (e, i) {
    if (!e) return;
    trouves++;
    const animal = article(e.p.animal) || article(DEFAUTS.animal);
    const div = document.createElement("div");
    div.className = "champion";
    const sem = document.createElement("span");
    sem.className = "sem";
    sem.textContent = numeroSemaine(semaines[i]);
    const nom = document.createElement("span");
    nom.className = "nom";
    nom.textContent = animal.emoji + " " + nomDe(e.p, e.id);
    const gain = document.createElement("span");
    gain.className = "gain";
    gain.textContent = "+" + (e.p.gain || 0) + " XP";
    div.appendChild(sem);
    div.appendChild(nom);
    div.appendChild(gain);
    zone.appendChild(div);
  });

  if (trouves === 0) {
    const vide = document.createElement("p");
    vide.className = "message";
    vide.textContent = "Les champions apparaîtront à la fin de la première semaine.";
    zone.appendChild(vide);
  }
}

async function demarrer() {
  try {
    const cred = await signInAnonymously(auth);
    uid = cred.user.uid;
    await afficher();
    await chargerChchampionsSecurise();
  } catch (e) {
    $("alerte").textContent = "Connexion impossible : " + (e.code || e.message);
  }
}

async function chargerChampionsSecurise() {
  try {
    await chargerChampions();
  } catch (e) {
    $("champions").textContent = "";
  }
}

$("onglet-0").addEventListener("click", function () {
  onglet = 0;
  afficher();
});
$("onglet-1").addEventListener("click", function () {
  onglet = 1;
  afficher();
});

demarrer();
</script>
</body>
  </html>
