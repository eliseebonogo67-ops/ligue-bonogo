<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1250">
<title>Ligue Bonogo - Accueil</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="ecran">

  <header class="haut">
    <a class="avatar" href="profil.html" style="text-decoration: none; color: inherit;">🧑‍🎓</a>
    <div class="pieces"><span class="piece">B</span><b id="solde">…</b></div>
    <button class="icone" aria-label="Notifications">🔔<i class="point"></i></button>
  </header>
  <p id="titre-joueur" class="xp"></p>

  <div class="grade">
    <span id="badge-grade" class="badge">🛡️</span>
    <div class="jauge"><div id="jauge-plein" class="jauge-plein" style="width: 0%;"></div></div>
    <span id="badge-suivant" class="badge">🪖</span>
  </div>
  <p id="xp-texte" class="xp">…</p>
  <p id="serie-jours" class="xp"></p>

  <div class="rangee">
    <div class="lib"><a class="icone" href="boutique.html" style="display: grid; place-items: center; text-decoration: none;">🛍️</a>Boutique</div>
    <div class="lib"><a class="icone" href="classement.html" style="display: grid; place-items: center; text-decoration: none;">🏅</a>Classement</div>
  </div>
  <div class="rangee" style="margin-top: 18px;">
    <div class="lib"><button class="icone">🎖️</button>Palmarès</div>
    <div class="lib"><button id="btn-defi" class="icone">🎁<i id="point-defi" class="point"></i></button>Défi du jour</div>
  </div>

  <nav class="menu">
    <a class="btn jaune" href="salon.html"><span class="ic">🏆</span>Compétitions</a>
    <a class="btn bleu" href="defi.html"><span class="ic">⚔️</span>Défier un ami</a>
    <a class="btn vert" href="index.html"><span class="ic">📚</span>Entraînement</a>
    <button id="btn-test" class="btn bleu" style="font-size: 16px; padding: 12px;">🎁 +50 pièces (test)</button>
    <a class="btn jaune" href="admin.html" style="font-size: 16px; padding: 12px;">🔧 Administration</a>
  </nav>
  <p id="msg-test" class="message"></p>
  <div style="height: 80px;"></div>

</div>

<div id="fond-defi" class="fond" hidden>
  <div class="popup">
    <div class="ruban">DÉFI DU JOUR</div>
    <button id="fermer-defi" class="croix" aria-label="Fermer">✕</button>
    <p id="defi-texte" style="text-align: center; font-weight: 800; font-size: 17px; margin: 6px 0;"></p>
    <div class="jauge" style="margin: 14px 0 6px;"><div id="defi-jauge" class="jauge-plein" style="width: 0%;"></div></div>
    <p id="defi-progres" class="xp"></p>
    <button id="btn-reclamer" class="btn vert" style="margin-top: 14px;" disabled>Pas encore accompli</button>
    <a class="btn jaune" href="index.html" style="margin-top: 16px; font-size: 17px; padding: 12px;">📚 M’entraîner</a>
    <p id="defi-msg" class="message"></p>
  </div>
</div>

<script type="module">
import { signInAnonymously } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
import { auth, db } from "./firebase.js";
import { Sons, animerCompteur } from "./sons.js";
import { aujourdhui, gradeDe, totalXp, calculerSerie, defiDuJour, progresDefi } from "./progression.js";

const $ = function (id) {
  return document.getElementById(id);
};

let uid = null;
let v = {};

function afficherProgression() {
  $("solde").textContent = v.pieces || 0;

  const xp = totalXp(v);
  const g = gradeDe(xp);
  $("badge-grade").textContent = g.grade.emoji;
  $("badge-suivant").textContent = g.suivant ? g.suivant.emoji : "⭐";
  $("jauge-plein").style.width = g.pct + "%";
  $("xp-texte").textContent = g.suivant
    ? g.grade.nom + " · " + xp + " / " + g.suivant.xp + " XP"
    : g.grade.nom + " · " + xp + " XP (grade maximum)";

  const s = calculerSerie(v, aujourdhui());
  if (s.serie > 0) {
    $("serie-jours").textContent =
      "🔥 " + s.serie + " jour" + (s.serie > 1 ? "s" : "") + " d’affilée" +
      (s.aujourdhuiFait ? " ✓" : " · joue aujourd’hui pour la garder");
  } else {
    $("serie-jours").textContent = "Joue aujourd’hui pour lancer ta série 🔥";
  }
}

function afficherDefi() {
  const jour = aujourdhui();
  const d = defiDuJour(jour);
  const p = progresDefi(d, v, jour);
  const reclame = !!(v.defi && v.defi[jour]);

  $("defi-texte").textContent = d.texte;
  $("defi-jauge").style.width = Math.round((p / d.cible) * 100) + "%";
  $("defi-progres").textContent = p + " / " + d.cible + " · récompense : " + d.recompense + " 🪙";

  const b = $("btn-reclamer");
  if (reclame) {
    b.textContent = "Récompense récupérée ✓";
    b.disabled = true;
  } else if (p >= d.cible) {
    b.textContent = "Récupérer " + d.recompense + " 🪙";
    b.disabled = false;
  } else {
    b.textContent = "Pas encore accompli";
    b.disabled = true;
  }
  $("point-defi").hidden = reclame;
}

async function charger() {
  const snap = await get(ref(db, "joueurs/" + uid));
  v = snap.exists() ? snap.val() : {};
  afficherProgression();
  afficherDefi();
}

async function reclamer() {
  const jour = aujourdhui();
  const d = defiDuJour(jour);
  if ((v.defi && v.defi[jour]) || progresDefi(d, v, jour) < d.cible) return;

  const avant = v.pieces || 0;
  const maj = {};
  maj["joueurs/" + uid + "/pieces"] = avant + d.recompense;
  maj["joueurs/" + uid + "/defi/" + jour] = true;
  try {
    await update(ref(db), maj);
    v.pieces = avant + d.recompense;
    v.defi = v.defi || {};
    v.defi[jour] = true;
    animerCompteur($("solde"), avant, v.pieces, 900);
    afficherDefi();
    $("defi-msg").textContent = "+" + d.recompense + " 🪙 !";
  } catch (e) {
    $("defi-msg").textContent = "Erreur : " + (e.code || e.message);
  }
}

async function demarrer() {
  try {
    const cred = await signInAnonymously(auth);
    uid = cred.user.uid;
    await charger();
  } catch (e) {
    $("solde").textContent = "?";
    $("msg-test").textContent = "Erreur : " + (e.code || e.message);
  }
}

$("btn-defi").addEventListener("click", function () {
  afficherDefi();
  $("defi-msg").textContent = "";
  $("fond-defi").hidden = false;
});
$("fermer-defi").addEventListener("click", function () {
  $("fond-defi").hidden = true;
});
$("btn-reclamer").addEventListener("click", reclamer);

$("btn-test").addEventListener("click", async function () {
  if (!uid) return;
  try {
    const base = "joueurs/" + uid + "/";
    const snap = await get(ref(db, base + "pieces"));
    if (!snap.exists()) {
      const m1 = {};
      m1[base + "pieces"] = 0;
      m1[base + "creeLe"] = Date.now();
      await update(ref(db), m1);
    }
    const actuel = snap.exists() ? snap.val() : 0;
    const m2 = {};
    m2[base + "pieces"] = actuel + 50;
    await update(ref(db), m2);
    v.pieces = actuel + 50;
    animerCompteur($("solde"), actuel, actuel + 50, 1000);
    $("msg-test").textContent = "+50 pièces de test ajoutées.";
  } catch (e) {
    $("msg-test").textContent = "Erreur : " + (e.code || e.message);
  }
});

demarrer();
</script>
</body>
  </html>
